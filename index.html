<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black Friday у For Men</title>
  <meta name="description" content="Black Friday у For Men: крути барабан і вигравай знижку на for-men.ua або в магазині.">
  <meta name="theme-color" content="#0B0B0B">
  <link rel="icon" type="image/png" href="assets/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&subset=latin,cyrillic&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="https://for-men.ua" target="_blank" rel="noopener" class="site-header__logo">
      <img src="assets/logo.png" alt="For Men" width="600" height="242">
    </a>
  </header>

  <main>
    <section class="hero">
      <p class="hero__eyebrow"><span>BLACK</span> FRIDAY</p>
      <h1 class="hero__title">Крути барабан — вигравай знижку!</h1>
      <p class="hero__sub">Знижку можна використати на сайті або в магазині For Men.</p>
    </section>

    <section class="wheel-block" id="wheel-block">
      <div class="wheel">
        <svg class="wheel__pointer" viewBox="0 0 40 48" aria-hidden="true">
          <path d="M20 46 L2 4 Q20 -4 38 4 Z"/>
        </svg>
        <svg id="wheel" class="wheel__svg" viewBox="-110 -110 220 220" role="img" aria-label="Барабан знижок">
          <circle class="wheel__rim" r="108"/>
          <g id="wheel-rotor"></g>
          <circle class="wheel__hub-ring" r="20"/>
          <image href="assets/logo-mark.png" x="-17" y="-17" width="34" height="34"/>
        </svg>
      </div>
      <button id="spin-btn" class="btn btn--primary btn--spin" type="button">Крутити</button>
      <p id="cooldown" class="cooldown" hidden></p>
    </section>

    <section id="result" class="result" hidden aria-live="polite"></section>

    <section id="error" class="error" hidden role="alert"></section>
  </main>

  <footer class="site-footer">
    <a class="btn btn--outline" href="https://for-men.ua" target="_blank" rel="noopener">Перейти на for-men.ua</a>
    <nav class="socials" aria-label="Соцмережі">
      <a href="https://www.instagram.com/formenua" target="_blank" rel="noopener">Instagram</a>
      <a href="https://t.me/formenuaclub" target="_blank" rel="noopener">Telegram</a>
    </nav>
    <p class="site-footer__copy">© For Men</p>
  </footer>
</body>
</html>
